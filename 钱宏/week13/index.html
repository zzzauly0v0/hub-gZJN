<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness Engineering - Skills 渐进式加载演示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
  }

  /* ── 顶部 ── */
  header {
    background: #1a1d27;
    border-bottom: 1px solid #2d3148;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; color: #a78bfa; }
  header .subtitle { font-size: 12px; color: #64748b; }
  .reset-btn {
    margin-left: auto;
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid #7c3aed;
    background: transparent;
    color: #a78bfa;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover { background: #7c3aed; color: #fff; }

  /* ── 布局 ── */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    height: calc(100vh - 60px);
  }

  /* ── Skill 侧边栏 ── */
  .sidebar {
    background: #161922;
    border-right: 1px solid #2d3148;
    overflow-y: auto;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid #2d3148;
    font-size: 14px;
    font-weight: 600;
    color: #a78bfa;
  }

  .skill-item {
    padding: 12px 16px;
    border-bottom: 1px solid #1e2235;
    transition: background 0.2s;
  }

  .skill-item:hover { background: #1e2235; }

  .skill-name {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .skill-status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .skill-status.unloaded { background: #475569; }
  .skill-status.loaded { background: #10b981; box-shadow: 0 0 8px #10b981; }
  .skill-status.error { background: #ef4444; }

  .skill-desc {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .skill-keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .skill-keyword {
    font-size: 10px;
    padding: 2px 6px;
    background: #2d1f5e;
    border-radius: 4px;
    color: #a78bfa;
  }

  .skill-actions {
    margin-top: 8px;
    display: flex;
    gap: 6px;
  }

  .skill-btn {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #3d4163;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.2s;
  }

  .skill-btn:hover { border-color: #7c3aed; color: #a78bfa; }
  .skill-btn.loaded { border-color: #10b981; color: #10b981; }

  /* ── 主内容区 ── */
  .main {
    overflow-y: auto;
    padding: 24px 32px;
  }

  .container { max-width: 900px; margin: 0 auto; }

  /* ── 输入区 ── */
  .input-card {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  textarea {
    flex: 1;
    background: #0f1117;
    border: 1px solid #2d3148;
    border-radius: 8px;
    color: #e2e8f0;
    padding: 10px 14px;
    font-size: 14px;
    resize: vertical;
    min-height: 72px;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: #7c3aed; }

  .send-btn {
    padding: 0 24px;
    background: #7c3aed;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .send-btn:hover:not(:disabled) { background: #6d28d9; }
  .send-btn:disabled { background: #3d4163; cursor: not-allowed; }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .example-chip {
    background: #1e2235;
    border: 1px solid #2d3148;
    border-radius: 16px;
    padding: 4px 12px;
    font-size: 12px;
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.2s;
  }

  .example-chip:hover { border-color: #7c3aed; color: #a78bfa; }

  /* ── 状态栏 ── */
  .status-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    color: #94a3b8;
  }

  .status-bar.visible { display: flex; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #3d4163;
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 步骤卡片 ── */
  .steps-container { display: flex; flex-direction: column; gap: 12px; }

  .step-card {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 10px;
    padding: 14px 16px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .step-type {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 8px;
  }

  .step-type.loading_skills { background: #1e3a5f; color: #38bdf8; }
  .step-type.skills_loaded { background: #1a3a2a; color: #10b981; }
  .step-type.thinking { background: #3d3a1a; color: #fbbf24; }
  .step-type.tool_call { background: #3d2a1a; color: #fb923c; }
  .step-type.final { background: #2d1f5e; color: #a78bfa; }
  .step-type.error { background: #3d1a1a; color: #f87171; }

  .step-content {
    font-size: 13px;
    line-height: 1.6;
    color: #cbd5e1;
  }

  .step-content pre {
    background: #0f1117;
    padding: 8px;
    border-radius: 4px;
    overflow-x: auto;
    margin-top: 8px;
  }

  .step-content code {
    font-family: monospace;
    font-size: 12px;
  }

  .tool-info {
    background: #0f1117;
    padding: 10px;
    border-radius: 6px;
    margin-top: 10px;
  }

  .tool-info-label {
    font-size: 10px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .tool-info-content {
    font-size: 12px;
    color: #94a3b8;
    font-family: monospace;
    white-space: pre-wrap;
  }

  /* ── 统计信息 ── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 8px;
    padding: 12px 16px;
  }

  .stat-label {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 600;
    color: #a78bfa;
  }

  /* ── 引擎状态 ── */
  .engine-info {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }

  .engine-info h3 {
    font-size: 14px;
    color: #a78bfa;
    margin-bottom: 12px;
  }

  .engine-info-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 12px;
    color: #94a3b8;
  }

  .engine-info-row .label { color: #64748b; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🔧 Harness Engineering</h1>
    <div class="subtitle">Skills 渐进式加载演示 | 按需激活相关技能</div>
  </div>
  <button class="reset-btn" onclick="resetEngine()">🔄 重置对话</button>
</header>

<div class="layout">
  <!-- Skill 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">可用 Skills</div>
    <div id="skillList">加载中...</div>
  </aside>

  <!-- 主内容区 -->
  <main class="main">
    <div class="container">
      <!-- 统计信息 -->
      <div class="stats-bar" id="statsBar">
        <div class="stat-card">
          <div class="stat-label">总 Skill 数</div>
          <div class="stat-value" id="totalSkills">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">已加载</div>
          <div class="stat-value" id="loadedSkills" style="color:#10b981">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">对话轮数</div>
          <div class="stat-value" id="turnCount">0</div>
        </div>
      </div>

      <!-- 引擎信息 -->
      <div class="engine-info" id="engineInfo" style="display:none">
        <h3>⚡ 引擎状态</h3>
        <div id="engineInfoContent"></div>
      </div>

      <!-- 输入区 -->
      <div class="input-card">
        <div class="input-row">
          <textarea id="question" placeholder="输入问题，例如：给我做一张 crazy 的闪卡"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendQuery()">发送</button>
        </div>
        <div class="examples">
          <span style="font-size:12px;color:#475569;">试试：</span>
          <span class="example-chip" onclick="setQuestion(this.textContent)">给我做一张 crazy 的闪卡</span>
          <span class="example-chip" onclick="setQuestion(this.textContent)">做一个 resilient 的单词卡</span>
          <span class="example-chip" onclick="setQuestion(this.textContent)">列出所有闪卡</span>
          <span class="example-chip" onclick="setQuestion(this.textContent)">查看 crazy 闪卡详情</span>
        </div>
      </div>

      <!-- 状态栏 -->
      <div class="status-bar" id="statusBar">
        <div class="spinner"></div>
        <span id="statusText">正在处理...</span>
      </div>

      <!-- 步骤展示 -->
      <div class="steps-container" id="stepsContainer"></div>
    </div>
  </main>
</div>

<script>
  let isRunning = false;
  let turnCount = 0;

  // ── 初始化 ──
  document.addEventListener('DOMContentLoaded', async () => {
    await loadSkills();
    await updateEngineStatus();
  });

  async function loadSkills() {
    try {
      const resp = await fetch('/skills');
      const data = await resp.json();
      renderSkillList(data.skills);
      updateStats();
    } catch (err) {
      console.error('加载 Skills 失败:', err);
      document.getElementById('skillList').innerHTML = '<div style="padding:16px;color:#ef4444;">加载失败</div>';
    }
  }

  function renderSkillList(skills) {
    const container = document.getElementById('skillList');
    
    if (skills.length === 0) {
      container.innerHTML = '<div style="padding:16px;color:#64748b;">暂无 Skill</div>';
      return;
    }

    container.innerHTML = skills.map(s => `
      <div class="skill-item">
        <div class="skill-name">
          <span class="skill-status ${s.state}"></span>
          ${s.metadata.name}
        </div>
        <div class="skill-desc">${s.metadata.description || '暂无描述'}</div>
        <div class="skill-keywords">
          ${(s.metadata.keywords || []).map(k => `<span class="skill-keyword">${k}</span>`).join('')}
        </div>
        <div class="skill-actions">
          ${s.is_loaded 
            ? `<button class="skill-btn loaded" onclick="unloadSkill('${s.metadata.name}')">卸载</button>`
            : `<button class="skill-btn" onclick="loadSkill('${s.metadata.name}')">加载</button>`
          }
        </div>
      </div>
    `).join('');
  }

  async function loadSkill(name) {
    try {
      const resp = await fetch(`/skills/${encodeURIComponent(name)}/load`, { method: 'POST' });
      if (resp.ok) {
        await loadSkills();
        showToast(`Skill "${name}" 已加载`);
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function unloadSkill(name) {
    try {
      const resp = await fetch(`/skills/${encodeURIComponent(name)}/unload`, { method: 'POST' });
      if (resp.ok) {
        await loadSkills();
        showToast(`Skill "${name}" 已卸载`);
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function updateEngineStatus() {
    try {
      const resp = await fetch('/engine/status');
      const data = await resp.json();
      
      const hasLLM = data.has_llm_func;
      const loadedSkills = data.skill_manager.loaded_skills;
      
      document.getElementById('engineInfo').style.display = 'block';
      document.getElementById('engineInfoContent').innerHTML = `
        <div class="engine-info-row">
          <span class="label">LLM 状态：</span>
          <span style="color:${hasLLM ? '#10b981' : '#fbbf24'}">${hasLLM ? '已配置' : '演示模式'}</span>
        </div>
        <div class="engine-info-row">
          <span class="label">已加载 Skills：</span>
          <span style="color:#a78bfa">${loadedSkills.join(', ') || '无'}</span>
        </div>
        <div class="engine-info-row">
          <span class="label">已注册工具：</span>
          <span>${(data.registered_tools || []).join(', ') || '无'}</span>
        </div>
      `;
    } catch (err) {
      console.error(err);
    }
  }

  function updateStats() {
    const items = document.querySelectorAll('.skill-item');
    document.getElementById('totalSkills').textContent = items.length;
    
    const loaded = document.querySelectorAll('.skill-status.loaded');
    document.getElementById('loadedSkills').textContent = loaded.length;
  }

  function setQuestion(text) {
    document.getElementById('question').value = text;
  }

  function setStatus(text, visible = true) {
    const bar = document.getElementById('statusBar');
    document.getElementById('statusText').textContent = text;
    bar.classList.toggle('visible', visible);
  }

  function setSendEnabled(enabled) {
    const btn = document.getElementById('sendBtn');
    btn.disabled = !enabled;
    btn.textContent = enabled ? '发送' : '处理中...';
    isRunning = !enabled;
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.style.cssText = `
      position: fixed; top: 20px; right: 20px;
      background: #1a3a2a; color: #10b981;
      padding: 10px 20px; border-radius: 8px;
      border: 1px solid #10b981;
      font-size: 14px; z-index: 1000;
      animation: fadeIn 0.3s ease;
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // ── 主发送逻辑 ──
  async function sendQuery() {
    if (isRunning) return;
    const question = document.getElementById('question').value.trim();
    if (!question) return;

    setSendEnabled(false);
    setStatus('正在处理...', true);

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      let currentAnswer = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch { continue; }

          if (data.type === 'loading_skills') {
            setStatus(data.message || '正在匹配技能...', true);
            addStepCard('loading_skills', data.message);

          } else if (data.type === 'skills_loaded') {
            setStatus(data.message || '技能已加载', true);
            addStepCard('skills_loaded', data.message, { skills: data.skills });
            await loadSkills();

          } else if (data.type === 'thinking') {
            setStatus(data.message || '正在思考...', true);
            addStepCard('thinking', data.message);

          } else if (data.type === 'tool_call') {
            const toolInfo = `工具: ${data.tool_name}\n参数: ${JSON.stringify(data.tool_args)}\n结果: ${data.tool_result}`;
            addStepCard('tool_call', `调用工具 ${data.tool_name}`, { 
              tool: data.tool_name,
              args: data.tool_args,
              result: data.tool_result 
            });

          } else if (data.type === 'final') {
            currentAnswer = data.answer;
            addStepCard('final', data.answer, {
              skills_used: data.skills_used,
              total_steps: data.total_steps,
            });
            setStatus('完成', false);
            turnCount++;
            document.getElementById('turnCount').textContent = turnCount;

          } else if (data.type === 'error') {
            addStepCard('error', data.message);
            setStatus('', false);

          } else if (data.type === 'stream_done') {
            setStatus('', false);
          }
        }
      }

      await updateEngineStatus();

    } catch (err) {
      document.getElementById('stepsContainer').innerHTML += `
        <div class="step-card" style="border-color:#7f1d1d;">
          <div class="step-type error">错误</div>
          <div class="step-content">请求失败: ${esc(err.message)}</div>
        </div>
      `;
      setStatus('', false);
    } finally {
      setSendEnabled(true);
    }
  }

  function addStepCard(type, content, data = {}) {
    const container = document.getElementById('stepsContainer');
    const card = document.createElement('div');
    card.className = 'step-card';

    const iconMap = {
      loading_skills: '🔍',
      skills_loaded: '✅',
      thinking: '💭',
      tool_call: '🔧',
      final: '🎉',
      error: '❌',
    };

    let extraHtml = '';
    if (data.skills && data.skills.length > 0) {
      extraHtml += `<div style="margin-top:8px;color:#a78bfa;">激活的技能: ${data.skills.join(', ')}</div>`;
    }
    if (data.tool) {
      extraHtml += `
        <div class="tool-info">
          <div class="tool-info-label">工具调用详情</div>
          <div class="tool-info-content">
            <div>工具名: ${data.tool}</div>
            <div>参数: ${JSON.stringify(data.args)}</div>
            <div>结果: ${data.result}</div>
          </div>
        </div>
      `;
    }
    if (data.answer) {
      // final 类型的完整回答已在 content 中
    }

    card.innerHTML = `
      <div class="step-type ${type}">${iconMap[type] || '📌'} ${type}</div>
      <div class="step-content">${esc(content)}</div>
      ${extraHtml}
    `;

    container.appendChild(card);
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function resetEngine() {
    try {
      await fetch('/engine/reset', { method: 'POST' });
      document.getElementById('stepsContainer').innerHTML = '';
      turnCount = 0;
      document.getElementById('turnCount').textContent = '0';
      showToast('引擎已重置');
      await loadSkills();
      await updateEngineStatus();
    } catch (err) {
      console.error(err);
    }
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('question').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); }
  });
</script>
</body>
</html>
